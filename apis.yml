name: Rovi Health
description: >-
  Rovi Health is a clinical navigation platform for employer health plans that
  puts "a clinician in every member's pocket." Members get text-based access to
  registered nurse care advisors who help them find high-quality, in-network
  doctors and specialists, navigate their insurance benefits and coverage, and
  coordinate care across every stage of treatment. The company also uses AI
  agents to search millions of pricing and quality data points to surface the
  best in-network providers for complex care and to handle appointment
  scheduling, aiming to help employers cut 10-20% of healthcare spend while
  improving employee outcomes. Rovi Health was a Y Combinator (Fall 2025)
  company operating in the digital health, health insurance navigation, and
  consumer health services space. As of this enrichment pass Rovi Health
  publishes no public API, SDK, or developer documentation surface.
